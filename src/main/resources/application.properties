# ==============================================================
# Enviro365 Investment Withdrawal System - Application Config
# ==============================================================

spring.application.name=enviro365-investment-withdrawal-system

# --------------------------------------------------------------
# Server
# --------------------------------------------------------------
server.port=8080

# --------------------------------------------------------------
# H2 Database (file-based so seed/demo data survives a restart)
# The file is created under backend/data/ relative to where the
# app is launched from.
# --------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/enviro365;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 web console - inspect the database at http://localhost:8080/h2-console
# JDBC URL to paste into the console login screen: jdbc:h2:file:./data/enviro365
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --------------------------------------------------------------
# JPA / Hibernate
# ddl-auto=update lets Hibernate create/update tables from the
# entity classes automatically - convenient for an assessment,
# avoids the need for hand-written schema migration scripts.
# --------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# data.sql runs after Hibernate creates the schema (because of the
# defer-datasource-initialization flag above) so seed data always
# lands in tables that actually exist yet.
spring.sql.init.mode=always

# --------------------------------------------------------------
# CORS - allow the local React dev server to call this API.
# Configured properly in config/CorsConfig.java rather than here;
# this file only documents the intent.
# --------------------------------------------------------------
