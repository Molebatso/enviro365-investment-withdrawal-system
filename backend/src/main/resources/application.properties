# ==============================================================
# Enviro365 Investment Withdrawal System - Application Config
# ==============================================================

spring.application.name=enviro365-investment-withdrawal-system

# --------------------------------------------------------------
# Server
# --------------------------------------------------------------
server.port=8080

# --------------------------------------------------------------
# H2 Database (in-memory, recreated fresh on every application
# restart). DB_CLOSE_DELAY=-1 keeps the database alive for the
# life of the JVM instead of closing when the last connection
# does.
#
# DESIGN DECISION: in-memory + create-drop (below) instead of a
# persistent file. An evaluator/interviewer will likely restart
# this app multiple times; in-memory + fresh seed data on every
# boot guarantees a predictable demo every time, rather than
# accumulating withdrawal history (or hitting duplicate seed-data
# errors) across restarts.
# --------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:enviro365;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 web console - inspect the database at http://localhost:8080/h2-console
# JDBC URL to paste into the console login screen: jdbc:h2:mem:enviro365
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --------------------------------------------------------------
# JPA / Hibernate
# ddl-auto=create-drop: schema is created fresh on startup and
# dropped on shutdown. Paired with the in-memory datasource above,
# this means data.sql seed data loads cleanly every single run.
# --------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# data.sql runs after Hibernate creates the schema (because of the
# defer-datasource-initialization flag above) so seed data always
# lands in tables that actually exist yet.
spring.sql.init.mode=always

# --------------------------------------------------------------
# CORS - allow the local React dev server to call this API.
# Configured properly in config/CorsConfig.java rather than here;
# this file only documents the intent.
# --------------------------------------------------------------
